{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شبیه‌ساز خودران</title>
  <link rel="preload" href="{% static 'client/fonts/Vazirmatn.woff2' %}" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url("{% static 'client/fonts/Vazirmatn.woff2' %}") format('woff2');
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    /* The canvas fills the viewport; every overlay sits on top of it. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    }

    #scene-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud-top {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(13, 17, 23, 0.72);
      color: #e6edf3;
      font-size: 15px;
      line-height: 1.5;
      backdrop-filter: blur(6px);
    }

    .hud-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-inline: 10px;
      border-inline-start: 1px solid rgba(230, 237, 243, 0.18);
    }

    .hud-item:first-child {
      border-inline-start: 0;
      padding-inline-start: 0;
    }

    .hud-label {
      color: #9aa7b4;
      font-size: 13px;
    }

    .hud-value {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .hud-unit {
      color: #9aa7b4;
      font-size: 12px;
    }

    /* Collision and wall counters turn red once they are above zero. */
    #collision-count.is-hot,
    #wall-count.is-hot {
      color: #f85149;
    }

    /* Turn-signal arrows share the 3 Hz phase of the 3D lamps. */
    .turn-arrow {
      color: rgba(230, 237, 243, 0.25);
      font-size: 18px;
      font-weight: 900;
      transition: none;
    }

    .turn-arrow.is-lit {
      color: #ffeb3b;
      text-shadow: 0 0 8px rgba(255, 235, 59, 0.8);
    }

    .dashboard-link {
      display: inline-block;
      margin-inline-start: 16px;
      color: #e6edf3;
      text-underline-offset: 4px;
    }

    /* Connection state colours, toggled from scene.js. */
    #ws-status.is-connected { color: #3fb950; }
    #ws-status.is-disconnected { color: #f85149; }
    #ws-status.is-pending { color: #d29922; }

    #hud-legend {
      position: fixed;
      bottom: 16px;
      right: 16px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(13, 17, 23, 0.6);
      color: #9aa7b4;
      font-size: 13px;
    }

    #hud-legend kbd {
      display: inline-block;
      padding: 0 5px;
      border: 1px solid rgba(230, 237, 243, 0.3);
      border-radius: 4px;
      color: #e6edf3;
      font-family: inherit;
    }

    /*
     * Full-screen hazard flash, shown on collisions (red) and wall grinding
     * (orange). The phone camera sees it too, so the flash doubles as the
     * visual warning channel towards the driving model.
     */
    #hazard-flash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }

    #hazard-flash.is-running.is-collision {
      animation: hazard-fade-red 1s ease-out forwards;
    }

    #hazard-flash.is-running.is-wall {
      animation: hazard-fade-orange 0.8s ease-out forwards;
    }

    #hazard-flash.is-collision {
      background: rgba(220, 38, 38, 0.35);
    }

    #hazard-flash.is-wall {
      background: rgba(234, 138, 30, 0.3);
    }

    #hazard-flash-text {
      margin-top: -10vh;
      padding: 14px 28px;
      border-radius: 14px;
      background: rgba(13, 17, 23, 0.8);
      color: #ffe08a;
      font-size: 30px;
      font-weight: 800;
    }

    @keyframes hazard-fade-red {
      0% { opacity: 1; }
      60% { opacity: 0.8; }
      100% { opacity: 0; }
    }

    @keyframes hazard-fade-orange {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div id="hud-top">
    <div class="hud-item">
      <span class="hud-label">اتصال</span>
      <span id="ws-status" class="hud-value is-pending">در حال اتصال…</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">سرعت</span>
      <span id="speed-value" class="hud-value">0</span>
      <span class="hud-unit">km/h</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">زاویه</span>
      <span id="heading-value" class="hud-value">0°</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">راهنما</span>
      <span id="turn-left" class="turn-arrow" aria-label="راهنمای چپ">◀</span>
      <span id="turn-right" class="turn-arrow" aria-label="راهنمای راست">▶</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">برخورد</span>
      <span id="collision-count" class="hud-value">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">دیوار</span>
      <span id="wall-count" class="hud-value">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">FPS</span>
      <span id="fps-value" class="hud-value">–</span>
    </div>
  </div>

  <div id="hazard-flash" aria-live="assertive">
    <span id="hazard-flash-text"></span>
  </div>

  <div id="hud-legend">
    <kbd>↑</kbd>/<kbd>W</kbd> گاز &nbsp;·&nbsp; <kbd>↓</kbd>/<kbd>S</kbd> ترمز &nbsp;·&nbsp; <kbd>←</kbd>/<kbd>→</kbd>/<kbd>A</kbd>/<kbd>D</kbd> فرمان
    <span aria-hidden="true">·</span> بدون فرمان گوشی، کیبورد می‌راند
    <a class="dashboard-link" href="{% url 'client:dashboard' %}" target="_blank" rel="noopener">داشبورد موبایل ↗</a>
  </div>

  <script type="module" src="{% static 'simulation/js/scene.js' %}"></script>
</body>
</html>
